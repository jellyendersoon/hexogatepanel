<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Hexogate</title>
    <style>
      :root {
        --background: 216 92% 14%;
        --foreground: 216 73% 93%;
        --muted-foreground: 214 42% 73%;
        --border: 215 70% 27%;
        --primary: 195 78% 63%;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: hsl(var(--background));
        background-image: radial-gradient(55% 45% at 50% 0%, hsl(var(--primary) / 0.18), transparent 70%);
        background-repeat: no-repeat;
        color: hsl(var(--foreground));
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        text-align: center;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .brand-mark {
        width: 112px;
        height: 112px;
        object-fit: contain;
        filter: drop-shadow(0 12px 32px hsl(var(--primary) / 0.25));
      }

      h1 {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        line-height: 1.2;
      }

      .rule {
        width: 48px;
        height: 2px;
        border-radius: 999px;
        background: hsl(var(--primary));
      }

      @media screen and (min-width: 640px) {
        .brand-mark {
          width: 144px;
          height: 144px;
        }

        h1 {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
